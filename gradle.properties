# Compiler configuration (aligned with Bilibili_Innocent_Lab CI defaults).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.parallel=true
org.gradle.internal.instrumentation.agent=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Android baseline; values follow BIL so both projects resolve the same toolchain.
project.android.compileSdk=37
project.android.minSdk=27
project.android.targetSdk=37

# AGP built-in Kotlin follows BIL. Java-only Android variants explicitly exclude Kotlin runtime/metadata.
