name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_COMPILE_SDK_PACKAGE: 'platforms;android-37.2'
  CI_BUILD_TOOLS: '37.0.0'
  JDK_JAVA_OPTIONS: '-XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+UseCodeCacheFlushing'

jobs:
  verify:
    name: JDK 27 tests, ABI, lint and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools

      - name: Install exact Android SDK packages
        shell: bash
        run: sdkmanager "${CI_COMPILE_SDK_PACKAGE}" "build-tools;${CI_BUILD_TOOLS}"

      - name: Enable Gradle wrapper
        shell: bash
        run: chmod +x gradlew && ./gradlew --version

      - name: Run JVM tests and consumers
        shell: bash
        run: |
          ./gradlew \
            :hook-dsl:test \
            :hook-testing:test \
            :sample-java-contracts:run \
            :sample-kotlin-contracts:run \
            :backend-libxposed-101:testDebugUnitTest \
            :backend-libxposed-102:testDebugUnitTest \
            :device-benchmark-host:testDebugUnitTest \
            :device-benchmark-module-101:testDebugUnitTest \
            :device-benchmark-module-102:testDebugUnitTest \
            :device-clock-diagnostic:testDebugUnitTest \
            :device-cpubody-host:testDebugUnitTest \
            :device-cpubody-module-101:testDebugUnitTest \
            :device-cpubody-module-102:testDebugUnitTest \
            --no-daemon --console=plain

      - name: Check public API surfaces
        shell: bash
        run: ./gradlew apiCheck --no-daemon --console=plain

      - name: Check device-cell log verification
        shell: bash
        run: python3 -m unittest discover -s tools/device-cell -p 'test_*.py'

      - name: Check pilot record verification
        shell: bash
        run: python3 -m unittest discover -s tools/performance -p 'test_*.py'

      - name: Run full Android lint
        shell: bash
        run: ./gradlew lint --no-daemon --console=plain

      - name: Build all release artifacts
        shell: bash
        run: |
          ./gradlew \
            :backend-libxposed-101:assembleRelease \
            :backend-libxposed-102:assembleRelease \
            :sample-module-101:assembleRelease \
            :sample-module-102:assembleRelease \
            :sample-module-kotlin-102:assembleRelease \
            :device-test-host:assembleRelease \
            :device-test-module-101:assembleRelease \
            :device-test-module-102:assembleRelease \
            :device-test-host:assembleDeviceTest \
            :device-test-module-101:assembleDeviceTest \
            :device-test-module-102:assembleDeviceTest \
            :device-benchmark-host:assembleRelease \
            :device-benchmark-module-101:assembleRelease \
            :device-benchmark-module-102:assembleRelease \
            :device-benchmark-host:assembleDeviceTest \
            :device-benchmark-module-101:assembleDeviceTest \
            :device-benchmark-module-102:assembleDeviceTest \
            :device-clock-diagnostic:assembleRelease \
            :device-clock-diagnostic:assembleDeviceTest \
            :device-cpubody-host:assembleRelease \
            :device-cpubody-module-101:assembleRelease \
            :device-cpubody-module-102:assembleRelease \
            :device-cpubody-host:assembleDeviceTest \
            :device-cpubody-module-101:assembleDeviceTest \
            :device-cpubody-module-102:assembleDeviceTest \
            --no-daemon --console=plain

      - name: Verify runtime dependency isolation
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/test_runtime_dependencies.sh
          for module in sample-module-101 sample-module-102 sample-module-kotlin-102 device-test-host device-test-module-101 device-test-module-102 device-benchmark-host device-benchmark-module-101 device-benchmark-module-102 device-clock-diagnostic device-cpubody-host device-cpubody-module-101 device-cpubody-module-102; do
            configurations=(releaseRuntimeClasspath)
            case "$module" in device-test-*|device-benchmark-*|device-clock-diagnostic|device-cpubody-*) configurations+=(deviceTestRuntimeClasspath);; esac
            for configuration in "${configurations[@]}"; do
              deps="$(./gradlew ":${module}:dependencies" --configuration "$configuration" --no-daemon --console=plain)"
              printf '%s\n' "$deps" | bash tools/ci/check_runtime_dependencies.sh "$module" "$configuration"
            done
          done
